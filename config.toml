baseURL = "https://byslab.dev/"
languageCode = "zh-cn"
title = "BYSLab"
theme = "PaperMod"
defaultContentLanguage = "zh"
enableGitInfo = true
pagination.pagerSize = 10

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

# Google Analytics 4
[services]
  [services.googleAnalytics]
    ID = "G-THV28BFEFB"

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 20

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 40

[params]
  [params.label]
    icon = "/images/logo.svg"
    iconHeight = 36
  favicon = "/favicon.svg"
  appleTouchIcon = "/apple-touch-icon.png"
  [params.analytics]
    [params.analytics.google]
      SiteVerificationTag = "eH1ZUCC6cNl7d6pWxlx5jUSlGhL9TELAFYtodQHIJXM"

  env = "production"
  description = "Build Your System Lab —— AI Infra 实践记录。GPU 集群 / LLM 推理部署 / K8s 踩坑手记"
  author = "BYS"
  ShowShareButtons = true
  ShowReadingTime = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowToc = true
  comments = false

  [params.homeInfoParams]
    Title = "BYSLab —— Build Your System Lab"
    Content = "AI Infra 实践记录。从 K8s 集群到 LLM 推理部署，从 3060 单卡到生产级系统，记录每一步踩坑和成长。"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/"

  [[params.socialIcons]]
    name = "email"
    url = "mailto:admin@byslab.dev"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.cover]
    hiddenInList = false
    hiddenInSingle = true

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]
