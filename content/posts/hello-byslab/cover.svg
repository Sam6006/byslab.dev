<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0L0 0 0 60" fill="none" stroke="#6366f1" stroke-width="0.5" opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <rect width="1200" height="800" fill="url(#grid)"/>
  <rect x="100" y="100" width="1000" height="600" rx="16" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.15"/>
  <g transform="translate(600,280)" text-anchor="middle">
    <text font-family="system-ui, sans-serif" font-size="72" font-weight="700" fill="url(#accent)" letter-spacing="2">B</text>
    <text font-family="system-ui, sans-serif" font-size="72" font-weight="600" fill="#6366f1" letter-spacing="1" x="45">Y</text>
    <text font-family="system-ui, sans-serif" font-size="72" font-weight="600" fill="#06b6d4" letter-spacing="1" x="84">S</text>
    <text font-family="system-ui, sans-serif" font-size="72" font-weight="300" fill="#64748b" x="124">Lab</text>
  </g>
  <text x="600" y="370" font-family="system-ui, sans-serif" font-size="28" font-weight="300" fill="#818cf8" text-anchor="middle" letter-spacing="6">BUILD YOUR SYSTEM LAB</text>
  <text x="600" y="430" font-family="system-ui, sans-serif" font-size="48" font-weight="500" fill="#f1f5f9" text-anchor="middle">Hello, BYSLab</text>
  <line x1="500" y1="460" x2="700" y2="460" stroke="url(#accent)" stroke-width="2" opacity="0.4"/>
  <text x="600" y="510" font-family="system-ui, sans-serif" font-size="18" font-weight="400" fill="#94a3b8" text-anchor="middle">我们的旅程从这里开始</text>
</svg>
