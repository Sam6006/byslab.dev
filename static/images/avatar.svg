<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 288 288" width="288" height="288">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </radialGradient>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- 圆形背景 -->
  <circle cx="144" cy="144" r="144" fill="url(#bg)"/>

  <!-- 外六边形 -->
  <polygon points="144,44 204,74 204,134 144,164 84,134 84,74" fill="url(#g)" opacity="0.08"/>
  <polygon points="144,44 204,74 204,134 144,164 84,134 84,74" fill="none" stroke="url(#g)" stroke-width="3"/>

  <!-- 内六边形 -->
  <polygon points="144,68 184,88 184,128 144,148 104,128 104,88" fill="url(#g)" opacity="0.12"/>
  <polygon points="144,68 184,88 184,128 144,148 104,128 104,88" fill="none" stroke="url(#g)" stroke-width="1.5"/>

  <!-- 节点 -->
  <circle cx="144" cy="68" r="5" fill="#6366f1"/>
  <circle cx="184" cy="88" r="5" fill="#6366f1"/>
  <circle cx="184" cy="128" r="5" fill="#06b6d4"/>
  <circle cx="144" cy="148" r="5" fill="#06b6d4"/>
  <circle cx="104" cy="128" r="5" fill="#06b6d4"/>
  <circle cx="104" cy="88" r="5" fill="#6366f1"/>
  <circle cx="144" cy="108" r="6" fill="url(#g)"/>

  <!-- 内部连接线 -->
  <line x1="144" y1="68" x2="144" y2="108" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>
  <line x1="184" y1="88" x2="144" y2="108" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>
  <line x1="184" y1="128" x2="144" y2="108" stroke="#06b6d4" stroke-width="1.5" opacity="0.3"/>
  <line x1="144" y1="148" x2="144" y2="108" stroke="#06b6d4" stroke-width="1.5" opacity="0.3"/>
  <line x1="104" y1="128" x2="144" y2="108" stroke="#06b6d4" stroke-width="1.5" opacity="0.3"/>
  <line x1="104" y1="88" x2="144" y2="108" stroke="#6366f1" stroke-width="1.5" opacity="0.3"/>

  <!-- 外部连接线 -->
  <line x1="84" y1="74" x2="104" y2="88" stroke="#818cf8" stroke-width="1" opacity="0.2"/>
  <line x1="204" y1="74" x2="184" y2="88" stroke="#818cf8" stroke-width="1" opacity="0.2"/>
  <line x1="204" y1="134" x2="184" y2="128" stroke="#22d3ee" stroke-width="1" opacity="0.2"/>
  <line x1="84" y1="134" x2="104" y2="128" stroke="#22d3ee" stroke-width="1" opacity="0.2"/>
</svg>
