<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e1b4b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="g2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.02"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#6366f1" stroke-width="0.3" opacity="0.08"/>
    </pattern>
    <pattern id="dot" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#6366f1" opacity="0.15"/>
    </pattern>
    <radialGradient id="glow1" cx="25%" cy="30%" r="40%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="70%" r="35%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:0.08"/>
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1440" height="900" fill="url(#bg)"/>

  <!-- 网格 -->
  <rect width="1440" height="900" fill="url(#grid)"/>
  <rect width="1440" height="900" fill="url(#dot)"/>

  <!-- 光晕 -->
  <rect width="1440" height="900" fill="url(#glow1)"/>
  <rect width="1440" height="900" fill="url(#glow2)"/>

  <!-- 装饰线 - 抽象电路 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0,450 L200,450 L250,400 L400,400" stroke="#6366f1" stroke-width="1" opacity="0.12"/>
    <path d="M1440,350 L1200,350 L1150,300 L1000,300" stroke="#06b6d4" stroke-width="1" opacity="0.1"/>
    <path d="M100,750 L300,750 L350,800 L550,800" stroke="#6366f1" stroke-width="0.8" opacity="0.08"/>

    <!-- 竖线 -->
    <path d="M800,0 L800,200 L850,250 L850,450" stroke="#06b6d4" stroke-width="1" opacity="0.1"/>
    <path d="M600,500 L600,700 L650,750 L650,900" stroke="#6366f1" stroke-width="0.8" opacity="0.08"/>
  </g>

  <!-- 节点 -->
  <g fill="#6366f1" opacity="0.25">
    <circle cx="400" cy="400" r="2.5"/>
    <circle cx="1000" cy="300" r="2"/>
    <circle cx="850" cy="250" r="2"/>
    <circle cx="550" cy="800" r="2"/>
  </g>
  <g fill="#06b6d4" opacity="0.2">
    <circle cx="250" cy="400" r="2"/>
    <circle cx="1150" cy="300" r="1.5"/>
    <circle cx="800" cy="200" r="1.5"/>
    <circle cx="600" cy="700" r="1.5"/>
  </g>

  <!-- 六边形芯片装饰 -->
  <g transform="translate(1200,600)" fill="none" stroke="#6366f1" stroke-width="0.8" opacity="0.08">
    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15"/>
    <polygon points="0,-18 15,-9 15,9 0,18 -15,9 -15,-9"/>
    <circle cx="0" cy="0" r="3" fill="#6366f1" opacity="0.15"/>
  </g>
  <g transform="translate(200,150)" fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.06">
    <polygon points="0,-35 30,-18 30,18 0,35 -30,18 -30,-18"/>
    <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10"/>
    <circle cx="0" cy="0" r="3.5" fill="#06b6d4" opacity="0.12"/>
  </g>
</svg>
